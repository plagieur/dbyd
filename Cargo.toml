[package]
name = "dbyb"
version = "0.1.0"
edition = "2024"
description = "Discord, But You're A Bot: a desktop Discord client for bots"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["http", "image", "all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rfd = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "twilight", "receive", "rustls", "tungstenite"] }
symphonia = { version = "0.5.2", default-features = false, features = ["pcm"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
